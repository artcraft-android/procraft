# UniFFI bindings of the `make2d_core` library: Kotlin for the Android app, Swift for the iPad app.

[bindings.kotlin]
package_name = "com.make2d.app.core"
cdylib_name = "make2d_core"

# The Swift file is compiled into the iPad app; its C half (Make2DCoreFFI, a header and a module
# map) is found on the import path ios/build-rust.sh writes.
[bindings.swift]
module_name = "Make2DCore"
ffi_module_name = "Make2DCoreFFI"
