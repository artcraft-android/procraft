[workspace]
resolver = "3"
members = ["crates/engine", "crates/gpu", "crates/core", "android/bindgen", "desktop"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
# `deny`, not `forbid`: the one place that talks to the platform (the Android bridge's surface
# module) allows it locally.
unsafe_code = "deny"

[workspace.lints.clippy]
# Never crash on input: no unwrap/expect/panics/indexing outside tests (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"
too_many_arguments = "allow"

[workspace.dependencies]
procraft-engine = { path = "crates/engine" }
procraft-gpu = { path = "crates/gpu" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "wgsl", "naga-ir"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# (numbers read back exactly as written: a vector stroke's placement is kept to the last bit)
serde_json = { version = "1", features = ["float_roundtrip"] }
png = "0.18"
miniz_oxide = "0.8"
parking_lot = "0.12"

[profile.dev]
opt-level = 1
# Line numbers in backtraces and the debugger, but no variable or type info:
# keeps target/debug a fraction of the size, which matters with a build per worktree.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
debug = false
