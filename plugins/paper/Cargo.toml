[package]
name = "paper"
version = "1.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "A plugin for ProCraft: papers of its own every stroke takes as a grain fixed to the canvas, shown under the art in a colour of its own"

[lib]
crate-type = ["cdylib"]

[dependencies]
kit = { package = "procraft-plugin-kit", path = "../kit" }

# Not a member of the app's workspace, and linked into nothing: it builds to a module of its own.
[workspace]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
